name: Apply NOVA runtime hardening

on:
  push:
    branches:
      - fix/full-hardening-20260730
    paths:
      - scripts/apply-runtime-hardening.mjs
      - .github/workflows/apply-runtime-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-hardening-20260730
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-runtime-hardening.mjs
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts
          if git diff --cached --quiet; then
            echo "Runtime already hardened"
          else
            git commit -m "fix(runtime): fail closed, rate limit and stream progress"
            git push origin HEAD:fix/full-hardening-20260730
          fi
