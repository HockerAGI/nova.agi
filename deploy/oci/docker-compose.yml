services:
  nova:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: hocker/nova-agi:local
    restart: unless-stopped
    env_file:
      - /etc/nova/nova.env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      nova:
        condition: service_healthy
    environment:
      NOVA_DOMAIN: ${NOVA_DOMAIN:?set NOVA_DOMAIN in /etc/nova/caddy.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
