name: Temporary Lockfile Refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Capture original lock digest
        run: echo "LOCK_BEFORE=$(sha256sum package-lock.json | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify remediated lock
        run: node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/fast-uri']?.version !== '3.1.5') process.exit(1)"

      - name: Commit exact lockfile to hardening branch when changed
        if: env.LOCK_BEFORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          lock_after="$(sha256sum package-lock.json | cut -d' ' -f1)"
          if [[ "$LOCK_BEFORE" == "$lock_after" ]]; then
            echo "Lockfile already synchronized; no mutation required."
            exit 0
          fi
          blob_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package-lock.json?ref=${GITHUB_HEAD_REF}" --jq .sha)"
          encoded="$(base64 -w0 package-lock.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/package-lock.json" \
            -f message='security(deps): synchronize patched NOVA lockfile' \
            -f content="$encoded" \
            -f sha="$blob_sha" \
            -f branch="$GITHUB_HEAD_REF" >/dev/null

      - name: Upload exact lockfile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nova-package-lock-3.1.5
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
