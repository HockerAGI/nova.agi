name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/full-hardening-20260730

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build-only
      NOVA_ORCHESTRATOR_KEY: dummy-orchestrator-key-for-build-only
      NOVA_RATE_LIMIT_MAX: "60"
      NOVA_RATE_LIMIT_WINDOW_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Integrate shared limiter
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const appPath = 'src/app.ts';
          let app = fs.readFileSync(appPath, 'utf8');

          if (!app.includes('await requestRateLimiter.consume')) {
            const factoryStart = app.indexOf('  const requestRateLimiter = createRequestRateLimiter({');
            const factoryEndMarker = '\n  });';
            const factoryEnd = app.indexOf(factoryEndMarker, factoryStart);
            if (factoryStart < 0 || factoryEnd < 0) {
              throw new Error('Rate limiter factory block not found');
            }

            const newFactory = [
              '  const requestRateLimiter = createRequestRateLimiter({',
              '    windowMs: Number(process.env.NOVA_RATE_LIMIT_WINDOW_MS ?? 60_000),',
              '    max: Number(process.env.NOVA_RATE_LIMIT_MAX ?? 60),',
              '  });',
            ].join('\n');
            app = app.slice(0, factoryStart) + newFactory + app.slice(factoryEnd + factoryEndMarker.length);

            const consumeStart = app.indexOf('    const decision = requestRateLimiter.consume({');
            const hookEndMarker = '\n  });\n\n\n  app.get("/mesh/status"';
            const consumeEnd = app.indexOf(hookEndMarker, consumeStart);
            if (consumeStart < 0 || consumeEnd < 0) {
              throw new Error('Rate limiter consume block not found');
            }

            const newConsume = [
              '    let decision;',
              '    try {',
              '      decision = await requestRateLimiter.consume({',
              '        ip: req.ip,',
              '        headers: req.headers,',
              '      });',
              '    } catch {',
              '      reply.header("Retry-After", 5);',
              '      return reply.code(503).send({',
              '        ok: false,',
              '        error: "RATE_LIMIT_UNAVAILABLE",',
              '        retry_after_seconds: 5,',
              '      });',
              '    }',
              '',
              '    reply.header("X-RateLimit-Limit", decision.limit);',
              '    reply.header("X-RateLimit-Remaining", decision.remaining);',
              '    reply.header("X-RateLimit-Reset", Math.ceil(decision.resetAt / 1000));',
              '',
              '    if (!decision.allowed) {',
              '      reply.header("Retry-After", decision.retryAfterSeconds);',
              '      return reply.code(429).send({',
              '        ok: false,',
              '        error: "RATE_LIMITED",',
              '        retry_after_seconds: decision.retryAfterSeconds,',
              '      });',
              '    }',
            ].join('\n');
            app = app.slice(0, consumeStart) + newConsume + app.slice(consumeEnd);
            fs.writeFileSync(appPath, app);
          }

          const testPath = 'tests/runtime-hardening.test.mjs';
          let tests = fs.readFileSync(testPath, 'utf8');
          if (!tests.includes('consume_nova_rate_limit')) {
            const anchor = '  assert.match(limiter, /createHash\\("sha256"\\)/);';
            const anchorIndex = tests.indexOf(anchor);
            if (anchorIndex < 0) {
              throw new Error('Rate limiter test anchor not found');
            }
            const assertions = [
              anchor,
              '  assert.match(limiter, /consume_nova_rate_limit/);',
              '  assert.match(app, /await requestRateLimiter\\.consume/);',
              '  assert.match(app, /RATE_LIMIT_UNAVAILABLE/);',
            ].join('\n');
            tests = tests.slice(0, anchorIndex) + assertions + tests.slice(anchorIndex + anchor.length);
            fs.writeFileSync(testPath, tests);
          }
          NODE

      - name: Persist integrated patch
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- src/app.ts tests/runtime-hardening.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts tests/runtime-hardening.test.mjs
          git commit -m "security(rate-limit): fail closed with shared limiter"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
