name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/full-hardening-20260730

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build-only
      NOVA_ORCHESTRATOR_KEY: dummy-orchestrator-key-for-build-only
      NOVA_RATE_LIMIT_MAX: "60"
      NOVA_RATE_LIMIT_WINDOW_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/owner-gate-resilience-20260730
          fetch-depth: 0

      - name: Repair provider budget scope
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/app.ts')
          text = path.read_text()
          text = text.replace(
            '  const provider = providerOrder[0] ?? pickProvider(runtimePolicy.prefer_effective);',
            '  let provider = providerOrder[0] ?? pickProvider(runtimePolicy.prefer_effective);',
            1,
          )
          anchor = '''  if (providerOrder.length === 0) {
            providerOrder.push(pickProvider(runtimePolicy.prefer_effective));
          }
          '''
          insertion = anchor + '''
          const budgetDecision = await providersWithinBudget(project_id, providerOrder);
          const effectiveProviderOrder = budgetDecision.available;
          provider = effectiveProviderOrder[0] ?? provider;
          '''
          if 'const effectiveProviderOrder = budgetDecision.available;' not in text:
            if anchor not in text:
              raise SystemExit('provider order anchor missing')
            text = text.replace(anchor, insertion, 1)
          if 'let provider =' not in text or 'const effectiveProviderOrder' not in text:
            raise SystemExit('provider budget scope repair incomplete')
          path.write_text(text)
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "hocker-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.ts .github/workflows/ci.yml
          git commit -m "fix(runtime): keep provider fallback state in scope"
          git push origin HEAD:audit/owner-gate-resilience-20260730

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
