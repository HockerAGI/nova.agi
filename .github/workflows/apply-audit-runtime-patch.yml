name: Apply NOVA resilience patch

on:
  push:
    branches:
      - audit/owner-gate-resilience-20260730

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/owner-gate-resilience-20260730
          fetch-depth: 0

      - name: Apply focused runtime changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app.ts')
          text = path.read_text()

          old_import = 'import { budgetCap } from "./lib/router.js";'
          new_import = 'import { providersWithinBudget } from "./lib/provider-budget.js";'
          if old_import not in text:
              raise SystemExit('budget import not found')
          text = text.replace(old_import, new_import, 1)

          old_order = '''  const providerOrder = providerOrderForIntent(intentDecision.intent, runtimePolicy.prefer_effective);
          const provider = providerOrder[0] ?? pickProvider(runtimePolicy.prefer_effective);

          if (providerOrder.length === 0) {
            providerOrder.push(pickProvider(runtimePolicy.prefer_effective));
          }
          '''
          new_order = '''  const providerOrder = providerOrderForIntent(intentDecision.intent, runtimePolicy.prefer_effective);

          if (providerOrder.length === 0) {
            providerOrder.push(pickProvider(runtimePolicy.prefer_effective));
          }

          const budgetDecision = await providersWithinBudget(project_id, providerOrder);
          const effectiveProviderOrder = budgetDecision.available;
          const provider = effectiveProviderOrder[0] ?? providerOrder[0] ?? pickProvider(runtimePolicy.prefer_effective);
          '''
          if old_order not in text:
              raise SystemExit('provider order block not found')
          text = text.replace(old_order, new_order, 1)

          old_tokens = '  const monthlyTokens = await tokensUsedThisMonth(project_id, provider);'
          new_tokens = '''  const monthlyTokens = effectiveProviderOrder.length > 0
            ? await tokensUsedThisMonth(project_id, provider).catch(() => 0)
            : 0;'''
          if old_tokens not in text:
              raise SystemExit('monthly token line not found')
          text = text.replace(old_tokens, new_tokens, 1)

          budget_block = re.compile(r'''\n  const monthlyBudgetCap = budgetCap\(provider\);\n  if \(monthlyTokens >= monthlyBudgetCap\) \{\n    return reply\.status\(429\)\.send\(\{\n      ok: false,\n      error: "Budget cap reached for provider\. Please try again later\.",\n      trace_id,\n      provider,\n    \}\);\n  \}\n''')
          text, count = budget_block.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('budget stop block not found')

          text = text.replace('providers: providerOrder,', 'providers: effectiveProviderOrder,')

          support_function = re.compile(r'''\nfunction supportWorkSummary\([\s\S]*?\n\}\n\n\n\nfunction chidoResearchGateReply''')
          text, count = support_function.subn('\nfunction chidoResearchGateReply', text, count=1)
          if count != 1:
              raise SystemExit('support summary function not found')

          text = text.replace('  const agiName = String(agi.name || "").trim();\n', '', 1)
          support_block = re.compile(r'''\n  const support = supportWorkSummary\(agi\);\n\n  if \(support && agiName && !new RegExp\([\s\S]*?\n  \}\n''')
          text, count = support_block.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('automatic AGI support claim block not found')

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-audit-runtime-patch.yml
          git config user.name "hocker-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.ts .github/workflows/apply-audit-runtime-patch.yml
          git commit -m "fix(runtime): preserve fallback and evidence-based AGI claims"
          git push origin HEAD:audit/owner-gate-resilience-20260730
