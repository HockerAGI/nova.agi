name: Repair MCP deferred metadata

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/mcp-owner-gate-bridge-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mcp-owner-gate-bridge-20260731
          fetch-depth: 0
      - name: Add deferred actions to final payload
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/app.ts')
          text = path.read_text()
          anchor = '''      mcp: {
                tools_available: nativeToolDefs.length,
                tool_calls_parsed: totalParsed,
                tool_calls_executed: totalExecuted,
                tool_calls_deferred: totalDeferred,
              },'''
          replacement = '''      mcp: {
                tools_available: nativeToolDefs.length,
                tool_calls_parsed: totalParsed,
                tool_calls_executed: totalExecuted,
                tool_calls_deferred: totalDeferred,
                deferred_actions: deferredMcpActions,
              },'''
          if 'deferred_actions: deferredMcpActions' not in text:
            if anchor not in text:
              raise SystemExit('final MCP payload anchor missing')
            text = text.replace(anchor, replacement, 1)
          text = text.replace('\nconst deferredMcpActions = collectDeferredMcpOwnerGateDrafts([', '\n  const deferredMcpActions = collectDeferredMcpOwnerGateDrafts([', 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/repair-mcp-deferred-metadata.yml
          git config user.name "hocker-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.ts .github/workflows/repair-mcp-deferred-metadata.yml
          git commit -m "fix(mcp): include deferred drafts in final chat payload"
          git push origin HEAD:feature/mcp-owner-gate-bridge-20260731
