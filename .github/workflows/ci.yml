name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build-only
      NOVA_ORCHESTRATOR_KEY: dummy-orchestrator-key-for-build-only
      NOVA_RATE_LIMIT_MAX: "60"
      NOVA_RATE_LIMIT_WINDOW_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate dependency lock reproducibly
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify dependency remediation
        run: |
          ! grep -q '"node_modules/jpeg-exif"' package-lock.json
          node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/pdfkit']?.version !== '0.19.1') process.exit(1)"

      - name: Export regenerated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: nova-runtime-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
