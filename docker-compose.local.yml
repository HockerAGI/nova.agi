services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  nova:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "8080"
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_PROVIDER: ollama
      PROVIDER_FALLBACKS: ollama,gemini,anthropic,openai,base44
      TEXT_PROVIDER_ORDER: ollama,gemini,anthropic,openai,base44
      CODE_PROVIDER_ORDER: ollama,gemini,anthropic,openai,base44
      LONG_CONTEXT_PROVIDER_ORDER: ollama,gemini,anthropic,openai,base44
      NOVA_SURVIVAL_MODE_ENABLED: "true"

volumes:
  ollama_models:
