name: Expand Ecosystem Repository Allowlist

on:
  push:
    branches:
      - fix/ecosystem-repository-allowlist-20260802
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ecosystem-repository-allowlist-20260802
      - name: Patch connector and regression
        run: |
          python - <<'PY'
          from pathlib import Path
          connector = Path('src/lib/mcp/mcp-github.ts')
          text = connector.read_text()
          old = '''const DEFAULT_REPOSITORIES = [
            "HockerAGI/hocker.one",
            "HockerAGI/nova.agi",
            "HockerAGI/hocker-node-agent",
          ] as const;'''
          new = '''const DEFAULT_REPOSITORIES = [
            "HockerAGI/hocker.one",
            "HockerAGI/nova.agi",
            "HockerAGI/hocker-node-agent",
            "HockerAGI/chido.casino",
            "HockerAGI/hocker.agi",
          ] as const;'''
          if old not in text:
              raise SystemExit('connector anchor not found')
          connector.write_text(text.replace(old, new))

          env = Path('env.example')
          text = env.read_text()
          text = text.replace(
            'NOVA_GITHUB_ALLOWED_REPOS=HockerAGI/hocker.one,HockerAGI/nova.agi,HockerAGI/hocker-node-agent',
            'NOVA_GITHUB_ALLOWED_REPOS=HockerAGI/hocker.one,HockerAGI/nova.agi,HockerAGI/hocker-node-agent,HockerAGI/chido.casino,HockerAGI/hocker.agi',
          )
          env.write_text(text)

          test = Path('tests/mcp-security-boundaries.test.mjs')
          text = test.read_text()
          anchor = '  assert.match(connector, /HockerAGI\\/hocker-node-agent/);\n'
          addition = anchor + '  assert.match(connector, /HockerAGI\\/chido\\.casino/);\n  assert.match(connector, /HockerAGI\\/hocker\\.agi/);\n'
          if anchor not in text:
              raise SystemExit('test anchor not found')
          test.write_text(text.replace(anchor, addition))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/mcp/mcp-github.ts env.example tests/mcp-security-boundaries.test.mjs
          git commit -m "fix(mcp): cover all ecosystem repositories"
          git push origin HEAD:fix/ecosystem-repository-allowlist-20260802
